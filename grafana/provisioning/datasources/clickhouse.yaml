# ClickHouse datasource for the provisioned dashboard (grafana/dashboards).
# Grafana fills in $CLICKHOUSE_USER and $CLICKHOUSE_PASSWORD from its environment.
apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: $CLICKHOUSE_USER
      defaultDatabase: KafkaEngine
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
