# Streaming ETL pipeline: MySQL -> Debezium -> Kafka -> ksqlDB -> ClickHouse
#
# Every image is pinned to a tested version so a fresh `docker compose up`
# keeps working when upstream `latest` tags move. Kafka runs in KRaft mode,
# so ZooKeeper is no longer needed.
name: streaming-etl

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file: database.env
    environment:
      MYSQL_DATABASE: streaming_etl_db
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    volumes:
      - ./mysql/init/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./mysql/init/01_debezium_user.sql:/docker-entrypoint-initdb.d/01_debezium_user.sql:ro
      - ./data/1_geo.sql:/docker-entrypoint-initdb.d/10_geo.sql:ro
      - ./data/2_address.sql:/docker-entrypoint-initdb.d/11_address.sql:ro
      - ./data/3_person.sql:/docker-entrypoint-initdb.d/12_person.sql:ro
    ports:
      - 3306:3306
    networks:
      - webproxy
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    hostname: kafka
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9991
    ports:
      - 9092:9092
      - 29092:29092
    networks:
      - webproxy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: cp-schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - 8081:8081
    networks:
      - webproxy

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - 8083:8083
    networks:
      - webproxy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb-server
    hostname: ksqldb-server
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 8088:8088
    networks:
      - webproxy
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/info > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # One-off: registers the Debezium connector from debeziumConfig.json.
  connector-init:
    image: curlimages/curl:8.10.1
    container_name: connector-init
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debeziumConfig.json:/config/debeziumConfig.json:ro
      - ./debezium/register-connector.sh:/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/register-connector.sh"]
    networks:
      - webproxy
    restart: "no"

  # One-off: creates the ksqlDB tables and joins from ksqldb/pipeline.sql
  # and fails if the final join query is not running.
  ksqldb-init:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: ksqldb-init
    depends_on:
      ksqldb-server:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
    volumes:
      - ./ksqldb:/ksqldb:ro
    entrypoint: ["/bin/sh", "/ksqldb/run-pipeline.sh"]
    networks:
      - webproxy
    restart: "no"

  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: ksqldb-cli
    networks:
      - webproxy
    depends_on: [ksqldb-server]
    entrypoint: /bin/sh
    tty: true

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: root
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 8123:8123
      - 9000:9000
    networks:
      - webproxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium-ui:
    image: debezium/debezium-ui:2.5
    container_name: debezium-ui
    depends_on: [debezium]
    ports:
      - 8080:8080
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    networks:
      - webproxy

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 9099:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088
    networks:
      - webproxy

networks:
  webproxy:
    name: streaming_etl_webproxy
    driver: bridge
