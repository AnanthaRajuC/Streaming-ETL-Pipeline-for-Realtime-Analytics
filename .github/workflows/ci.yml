name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts (shellcheck)
        run: shellcheck deploy.sh terminate.sh scripts/init-env.sh mysql/init/01_debezium_user.sh debezium/register-connector.sh ksqldb/run-pipeline.sh tests/smoke-test.sh tests/dashboard-check.sh

      - name: Docker Compose file
        run: |
          scripts/init-env.sh
          docker compose config --quiet

      - name: JSON files are valid
        run: jq empty debeziumConfig.json grafana/dashboards/*.json

      - name: Event generator compiles
        run: python3 -m py_compile data/fake-events.py

  e2e:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            rta/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r rta/requirements.txt

      - name: Create .env with generated passwords
        run: scripts/init-env.sh

      - name: Pull images
        run: docker compose pull --quiet

      - name: Deploy pipeline
        run: ./deploy.sh

      - name: Smoke test (MySQL -> ClickHouse)
        run: tests/smoke-test.sh

      - name: Event generator (inserts, updates, address changes, deletes)
        run: python data/fake-events.py --events 15 --min-delay 0.2 --max-delay 0.5

      - name: Grafana dashboard (every panel query)
        run: tests/dashboard-check.sh

      - name: dbt build
        working-directory: rta
        run: |
          set -a; source ../.env; set +a
          dbt build --profiles-dir .

      - name: Container logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: ./terminate.sh
